name: Actualizar ventas

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write

concurrency: ventas

jobs:
  contar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contar ventas en Stripe
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: node scripts/contar-ventas.mjs
      - name: Publicar si cambió
        run: |
          if [ -n "$(git status --porcelain ventas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add ventas.json
            git commit -m "Ventas: $(node -p 'require("./ventas.json").vendidos') ejemplares"
            git push
          fi
